# Experiment Contract — CryptoGuard
#
# Every experimental choice, frozen before the first fit. A choice absent from this file at fit time
# is not pre-registered, whatever a document claims afterwards. The digest of this file's *values*
# is recorded in the manifest of every dataset and every run built under it, so a silent edit cannot
# pass as the same pre-registration.
#
# Decisions behind these values live in docs/adr/0001 and 0004-0009; measurements behind the
# Primary Lag live in reports/data_audit_news.md.

version: 1

decision_protocol:
  timezone: UTC
  feature_cutoff: "00:00"
  decision_deadline: "00:10"
  execution: "01:00"
  feature_anchor_price: close_of_last_bar_closed_by_the_cutoff
  decision_price: open_of_the_01_00_bar
  label_rule: next_decision_price_strictly_greater
  horizon_days: 1

research_window:
  first_day: 2021-02-01
  last_day: 2025-11-30
  decision_days: 1764
  warm_up_days: 30

splits:
  development_last_day: 2024-12-31
  walk_forward: expanding
  refit: quarterly
  first_test_quarter: 2022Q1
  last_test_quarter: 2024Q4
  test_quarters: 12
  scored_development_days: 1096
  inner_validation_days: 90
  final_holdout_first_day: 2025-01-01
  final_holdout_last_day: 2025-11-30
  final_holdout_evaluations_allowed: 1

features:
  arm_a:
    - r_1
    - r_3
    - r_7
    - r_14
    - rv_7
    - rv_7_over_30
    - volume_7_over_30
  arm_b_extra:
    # Defined by ADR-0020, and pinned to the code constants in cryptoguard_core.news_features.
    # Both windows run over availability instants (stated time read as UTC + the lag), never over
    # stated times: over stated times the 24-hour window is empty at the Primary Lag.
    #   news_count_24h_log1p        = log1p(headlines available in (cutoff - 24h, cutoff])
    #   news_count_24h_over_7d_mean = recent / ((baseline + 1) / 7), where baseline counts the
    #                                 seven days ending 24h before the cutoff. The baseline excludes
    #                                 today so the ratio is not capped at 7; the +1 prior is what
    #                                 removes the zero-denominator case without inventing a ceiling.
    - news_count_24h_log1p
    - news_count_24h_over_7d_mean
  arm_c_extra:
    - sentiment_mean_24h
    - sentiment_mean_7d

news:
  lag_grid_hours: [1, 6, 24]
  primary_lag_hours: 24
  # Measured, not assumed: the busiest eight consecutive hours start at 09:00, one hour outside the
  # pre-registered 10:00-16:00 band, so the rule gives 24. The margin is 1.10%; see the audit.
  # The Sentiment Extractor: a frozen instrument, pinned to a commit rather than a moving tag, and
  # matched against the code constants in cryptoguard_core.sentiment. ADR-0015 and ADR-0021.
  #   Sentiment Score = p(positive) - p(negative), rounded to score_decimals, on [-1, +1]
  #   sentiment_mean_24h / sentiment_mean_7d = unweighted means over Availability Windows ending at
  #   the Feature Cutoff; the 7-day window contains the 24-hour one, because a mean cannot saturate
  # Reproducible to 1e-6, not bitwise: padding and the batch dimension change which kernels run.
  sentiment_extractor:
    name: ProsusAI/finbert
    revision: 4556d13015211d73dccd3fdd39d39232506f3e43
    max_tokens: 64
    score_decimals: 6
    device: cpu
    fine_tuned: false
  sentiment_when_absent: median_within_fold
  missingness_indicator: false
  votes_and_comments_as_features: false

# The Annotation Sample and the wording rule. Written before the first headline is labelled and
# before the first Arm C fit, which is what makes it a pre-registration (ADR-0016). The sample gates
# nothing: Arm C runs whatever the check shows. What it decides is how the result may be described.
#
# The threshold is a rule, not a number: agreement is compared against the sample's own
# majority-class rate over the compared headlines. Against 50% an instrument that answers
# "positive" to everything would look skilful on a corpus that reads 45% positive.
annotation:
  sample_size: 210
  sample_size_bounds: [150, 300]
  seed: 20260928
  strata: [calendar_year, daily_headline_volume_tercile]
  volume_bands: [quiet, typical, busy]
  allocation: proportional_largest_remainder
  labels: [positive, negative, neutral, unclear]
  unclear_excluded_from_agreement: true
  agreement_reference: sample_majority_class_rate
  # Verbatim, and binding on the report and on the page alike.
  wording_when_agreement_beats_reference: the tone of the news
  wording_otherwise: the extractor's reading of the headlines
  # Recorded, not enforced: ADR-0016 accepts one annotator and discloses the consequence in
  # reports/annotation_sample.md. A second annotator would be a better study, so the contract has no
  # business refusing to load for it — it would only be a digest change, which is the right ceremony.
  annotators: 1

preprocessing:
  fitted: within_fold
  imputation: median_within_fold
  scaling: standardise_within_fold

model:
  family: logistic_regression
  penalty: l2  # expressed as l1_ratio=0 in scikit-learn 1.9
  regularisation_grid: [0.01, 0.1, 1.0]
  regularisation_selected: within_fold_inner_validation

evaluation:
  selection_metric: log_loss
  headline_metric: net_cumulative_return_after_costs
  primary_comparison: arm_c_vs_arm_a
  secondary_forecast_metrics: [brier, accuracy, calibration_curve]
  secondary_decision_metrics: [max_drawdown, turnover, trades, time_invested]
  # ADR-0017. Blocks keep a day's neighbours travelling with it: a trending series resampled day by
  # day reports itself steadier than it is. Pinned to the constants in cryptoguard_core.bootstrap.
  #   wrap_and_truncate = a block running past the end wraps to the front, and the last block drawn
  #   is cut so a resample is exactly as long as the original.
  # The seed, the resample count and the confidence were added in ticket 05, after the arm results
  # were already measured. They select nothing — the bootstrap spends no Trial and ranks no arm — and
  # the conclusion is reported as invariant across seeds rather than asserted at one of them.
  bootstrap_kind: moving_block
  bootstrap_block_days: 20
  bootstrap_sensitivity_block_days: [5, 40]
  bootstrap_block_rule: wrap_and_truncate
  bootstrap_resamples: 10000
  bootstrap_seed: 20260928
  bootstrap_confidence: 0.95
  bootstrap_stability_seeds: [20260929, 20260930, 20261001, 20261002]

trials:
  budget: 12
  planned: 7

policy:
  to_btc_at: 0.55
  to_usdt_at: 0.45
  target_exposure_values: [0, 1]
  initial_capital_usdt: 1000
  initial_position: usdt

cost_scenarios:
  headline: base
  optimistic:
    fee_pct: 0.075
    slippage_bps: 1
  base:
    fee_pct: 0.10
    slippage_bps: 5
  pessimistic:
    fee_pct: 0.20
    slippage_bps: 20
