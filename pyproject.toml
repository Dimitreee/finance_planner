[project]
name = "cryptoguard"
version = "0.1.0"
description = "Explainable BTC/USDT advisor: forecast, policy, action, explanation, cost-aware evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "requests>=2.32",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
]

[project.scripts]
cryptoguard-job = "cryptoguard_jobs.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
    "types-requests>=2.32",
    "httpx2>=2.13.1",
]
# The Sentiment Extractor is a measuring instrument used offline to fill a cache, not part of the
# price-only product. Keeping it in its own group lets a deployment that ships Arm A install without
# ~2 GB of tensor libraries: `uv sync --no-group research`.
research = [
    "torch>=2.4",
    "transformers>=4.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/core/cryptoguard_core",
    "apps/api/cryptoguard_api",
    "jobs/cryptoguard_jobs",
]

[tool.uv]
# `make setup-python` is `uv sync`, and the research group must land in a developer checkout: the
# extractor is how Arm C's features exist at all.
default-groups = ["dev", "research"]
# The README promises an interpreter that does not come from the system or from conda. Without this
# the promise rests on uv's default preference, which an environment variable can flip.
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages", "apps/api", "jobs", "tests"]

# Neither ships type information. They are used inside typed code, so the boundary is annotated
# locally rather than pretending upstream stubs exist.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "sklearn.*"]
ignore_missing_imports = true
